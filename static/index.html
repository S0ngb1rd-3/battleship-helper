<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship Helper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Battleship Strategy Helper</h1>

        <div class="controls">
            <select id="configSelect" class="config-select"></select>
            <button id="editConfigsBtn" class="btn btn-secondary">Edit Configs</button>
            <button id="toggleHeatmapBtn" class="btn btn-primary">Show Heat Map</button>
            <button id="markSunkBtn" class="btn btn-warning">Mark Sunk</button>
            <button id="confirmSunkBtn" class="btn btn-success" style="display:none;">Confirm Sunk</button>
            <button id="cancelSunkBtn" class="btn btn-secondary" style="display:none;">Cancel</button>
            <button id="resetBtn" class="btn btn-secondary">Reset Game</button>
        </div>

        <!-- Config editor modal -->
        <div id="configModal" class="modal-overlay" style="display:none;">
            <div class="modal-panel">
                <h2>Game Configs</h2>
                <ul id="configList" class="config-list"></ul>
                <hr>
                <h3 id="formTitle">Add Config</h3>
                <div class="config-form">
                    <input type="hidden" id="editingName">
                    <div class="form-row">
                        <label>Name</label>
                        <input type="text" id="cfgName" placeholder="e.g. Quick 7×7">
                    </div>
                    <div class="form-row">
                        <label>Board Size</label>
                        <input type="number" id="cfgBoardSize" min="5" max="20" value="10">
                    </div>
                    <div class="form-row">
                        <label>Fleet</label>
                        <div id="shipRows"></div>
                        <button class="btn btn-secondary btn-sm" onclick="addShipRow()">+ Add Ship</button>
                    </div>
                    <div id="formError" class="form-error"></div>
                    <div class="form-actions">
                        <button class="btn btn-primary" onclick="saveConfig()">Save</button>
                        <button class="btn btn-secondary" onclick="cancelEdit()">Cancel</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="game-area">
            <div class="grid-container">
                <div id="gameGrid" class="game-grid"></div>
                <canvas id="heatmapCanvas" class="heatmap-overlay" style="display: none;"></canvas>
            </div>

            <div class="info-panel">
                <div class="stats">
                    <div class="stat">
                        <span class="label">Total Shots:</span>
                        <span id="shotCount" class="value">0</span>
                    </div>
                    <div class="stat">
                        <span class="label">Hits:</span>
                        <span id="hitCount" class="value">0</span>
                    </div>
                    <div class="stat">
                        <span class="label">Misses:</span>
                        <span id="missCount" class="value">0</span>
                    </div>
                </div>

                <div class="fleet-info">
                    <h3>Expected Fleet</h3>
                    <ul id="fleetList"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
